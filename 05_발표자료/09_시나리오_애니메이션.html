<meta charset="utf-8">
<title>정책핏 인천 — 시나리오 (슬라이드 2)</title>
<style>
  :root{
    --ink:#1A2B3C; --harbor:#0E5A8A; --cut:#C75000; --green:#1E7F4F;
    --gray:#8A8F98; --paper:#FFFFFF; --ice:#E8F0F6;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0F1720;
    font-family:"Malgun Gothic","맑은 고딕",system-ui,sans-serif}
  #wrap{height:100%;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:0}
  #stage{position:relative;width:min(96vw,calc(92vh*16/9));aspect-ratio:16/9;
    background:var(--paper);box-shadow:0 8px 40px rgba(0,0,0,.5);overflow:hidden}
  #stage svg{display:block;width:100%;height:100%}

  /* 등장·퇴장 */
  .fx{opacity:0;transition:opacity .45s ease, transform .45s ease}
  .fx.on{opacity:1}
  .rise{transform:translateY(18px)}   .rise.on{transform:translateY(0)}
  .slideL{transform:translateX(56px)} .slideL.on{transform:translateX(0)}
  .pop{transform:scale(.86);transform-origin:center} .pop.on{transform:scale(1)}

  /* 땀 */
  .drop{animation:drip 1.9s ease-in-out infinite}
  .drop.d2{animation-delay:.55s} .drop.d3{animation-delay:1.1s}
  @keyframes drip{0%{transform:translateY(0);opacity:0}
    18%{opacity:1}70%{opacity:1}100%{transform:translateY(26px);opacity:0}}
  /* 왕복 */
  .dash{stroke-dasharray:7 6;animation:march 1.1s linear infinite}
  @keyframes march{to{stroke-dashoffset:-26}}
  .shake.on{animation:shake 2.4s ease-in-out infinite}
  @keyframes shake{0%,100%{transform:translateX(0)}
    25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

  /* 자막 */
  #cap{width:min(96vw,calc(92vh*16/9));min-height:96px;padding:18px 26px;
    background:#0F1720;color:#F2F5F8;font-size:clamp(15px,2.1vh,24px);
    line-height:1.6;letter-spacing:-.01em;display:flex;align-items:center}
  #cap b{color:#8FC5EA;font-weight:600}
  #cap .k{color:#F0A868}
  #bar{width:min(96vw,calc(92vh*16/9));display:flex;gap:5px;padding:0 26px 16px;
    background:#0F1720;align-items:center}
  #bar i{flex:1;height:3px;background:#2A3742;border-radius:2px}
  #bar i.done{background:#8FC5EA}
  #hint{margin-left:14px;color:#5D6B78;font-size:12px;white-space:nowrap}
</style>

<div id="wrap">
<div id="stage">

<!-- 괘선 머리 -->
<text x="80" y="52" font-size="17" fill="#8A8F98">2026년 7월 · 인천광역시 반도체바이오과</text>
<line x1="80" y1="66" x2="1200" y2="66" stroke="#1A2B3C" stroke-width="1"/>

  <path d="M284 338 Q287 284 330 284 Q373 284 376 338 Q360 308 330 308 Q300 308 284 338 Z" fill="#1A2B3C"/>
  <circle cx="313" cy="344" r="4" fill="#1A2B3C"/>

  <path class="fx" data-in="8" d="M314 364 Q330 376 346 364"

  <path class="dash" d="M492 496 Q600 470 686 404" fill="none" stroke="#C75000" stroke-width="1.8" marker-end="url(#ah)" marker-start="url(#ah)"/>
  <path class="dash" d="M496 522 Q600 522 686 478" fill="none" stroke="#C75000" stroke-width="1.8" marker-end="url(#ah)" marker-start="url(#ah)"/>
  <rect x="690" y="286" width="252" height="52" rx="4" fill="#FFFFFF" stroke="#C75000" stroke-width="1.6"/>
  <text x="816" y="318" font-size="17" fill="#1A2B3C" text-anchor="middle">다른 과에 전화</text>
  <rect x="690" y="360" width="252" height="52" rx="4" fill="#FFFFFF" stroke="#C75000" stroke-width="1.6"/>
  <text x="816" y="392" font-size="17" fill="#1A2B3C" text-anchor="middle">작년 사업 목록 뒤지기</text>

  <text x="966" y="392" font-size="15" fill="#C75000">왕복</text>

<!-- 정책핏 패널 -->
<g class="fx slideL" data-in="7">
  <rect x="636" y="176" width="548" height="404" rx="6" fill="#FFFFFF" stroke="#1A2B3C" stroke-width="2.2"/>
  <rect x="636" y="176" width="548" height="52" rx="6" fill="#1A2B3C"/>
  <rect x="636" y="216" width="548" height="12" fill="#1A2B3C"/>
  <text x="662" y="210" font-size="21" font-weight="700" fill="#FFFFFF">정책핏 인천</text>
  <text x="1158" y="210" font-size="14" fill="#8FC5EA" text-anchor="end">개편 검토서 초안</text>

<g class="fx rise" data-in="8">

  <text x="716" y="310" font-size="14.5" fill="#8A8F98">소관 부서 + 고정 검토자(평가담당관)</text>

  <rect x="662" y="340" width="496" height="76" rx="4" fill="#E8F0F6"/>
  <text x="686" y="372" font-size="20" font-weight="700" fill="#0E5A8A">②</text>
  <text x="716" y="372" font-size="19" fill="#1A2B3C">정리할 겹침이 있다</text>
  <text x="716" y="398" font-size="14.5" fill="#8A8F98">조정 필요 중복 · 보완 관계</text>

  <rect x="662" y="428" width="496" height="76" rx="4" fill="#E8F0F6"/>
  <text x="686" y="460" font-size="20" font-weight="700" fill="#0E5A8A">③</text>

  <text x="716" y="486" font-size="14.5" fill="#8A8F98">내 사업은 「사람」을 채운다 · 「돈」이 2건 빈다</text>

<g class="fx" data-in="9">

<script>
var BEATS = [
  { t: '인천광역시 반도체바이오과 주무관입니다.', d: 3000 },
  { t: '담당 교육과정의 <b>성과평가가 끝났습니다.</b>', d: 3200 },
  { t: '「이 교육과정, 개편안 만들어 오세요.」 &#160;<b>마감은 7월 31일</b>입니다.', d: 4200 },
  { t: '소관 산업은 고를 일이 없습니다. <b>발의권이 과 단위</b>라 처음부터 정해져 있습니다.', d: 4200 },
  { t: '그런데 <span class="k">이거, 정말 필요한 사업이 맞나?</span>', d: 3800 },
  { t: '확인하려면 다른 과에 전화하고, 작년 사업 목록을 뒤지고, 겹치는지 눈으로 대조해야 합니다.', d: 5200 },
  { t: '<span class="k">혼자서는 확인할 방법이 없습니다.</span>', d: 3400 },
  { t: '여기서 <b>정책핏 인천</b>이 들어옵니다.', d: 3000 },
  { t: '결재에 붙일 <b>개편 검토서 초안 한 장</b> — 그 안에 세 가지가 들어 있습니다.', d: 5200 },
  { t: '판정은 전부 후보입니다. <b>확정은 사람이, 부서 협의로</b> 합니다.', d: 4200 }
];

var stage = document.getElementById('stage');
var cap = document.getElementById('cap');
var bar = document.getElementById('bar');
var hint = document.getElementById('hint');
var fx = [].slice.call(stage.querySelectorAll('.fx'));
var i = -1, auto = false, timer = null;

for (var n = 0; n < BEATS.length; n++) bar.insertBefore(document.createElement('i'), hint);
var ticks = bar.querySelectorAll('i');

function render() {
  for (var k = 0; k < fx.length; k++) {
    var el = fx[k];
    var a = el.dataset.in ? +el.dataset.in : 0;
    var b = el.dataset.out ? +el.dataset.out : 999;
    if (i >= a && i < b) el.classList.add('on'); else el.classList.remove('on');
  }
  cap.innerHTML = i < 0 ? '' : BEATS[i].t;
  for (var k = 0; k < ticks.length; k++) ticks[k].className = k <= i ? 'done' : '';
  hint.textContent = auto ? '자동재생 중 · A 정지'
    : (i + 1) + ' / ' + BEATS.length + ' · 클릭 또는 →   |   ← 이전 · R 처음 · A 자동재생';
}
function go(n) {
  clearTimeout(timer);
  i = Math.max(0, Math.min(BEATS.length - 1, n));
  render();
  if (auto && i < BEATS.length - 1) timer = setTimeout(function () { go(i + 1); }, BEATS[i].d);
  else if (auto) { auto = false; render(); }
}
document.addEventListener('keydown', function (e) {
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { auto = false; go(i + 1); e.preventDefault(); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { auto = false; go(i - 1); e.preventDefault(); }
  else if (e.key === 'r' || e.key === 'R') { auto = false; go(0); }
  else if (e.key === 'a' || e.key === 'A') { auto = !auto; if (auto) go(0); else { clearTimeout(timer); render(); } }
});
stage.addEventListener('click', function () { auto = false; go(i + 1); });
go(0);
</script>
